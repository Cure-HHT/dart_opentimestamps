# Security - Check for Secrets — emits a check named exactly
# "Security - Check for Secrets" to satisfy the org-level
# branch-protection ruleset's required context.
#
# Logic lives in the shared composite action at
# Cure-HHT/hht_workflows/.github/actions/secrets-scan. The wrapper is
# responsible for checking out this repo's full history (gitleaks
# scans it).

name: Security - Check for Secrets

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Security - Check for Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for gitleaks
      - uses: Cure-HHT/hht_workflows/.github/actions/secrets-scan@fb47aaf8dc2c55cd49adab6aaad3ced039709276  # v1.6.1
