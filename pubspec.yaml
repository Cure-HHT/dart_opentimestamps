name: dart_opentimestamps
description: Get a SHA-256 hash-chain head witnessed by Bitcoin through OpenTimestamps calendars, and verify the proof offline.
version: 0.10.0
repository: https://github.com/Cure-HHT/dart_opentimestamps.git
issue_tracker: https://github.com/Cure-HHT/dart_opentimestamps/issues

environment:
  sdk: ^3.0.0

dependencies:
  crypto: ^3.0.3
  http: ^1.2.0

executables:
  ots_verify:

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - bitcoin
  - blockchain
  - timestamping
  - cryptography
  - opentimestamps
